[package]
name = "grpcx-h3"
# Literal, NOT `version.workspace = true`. L5 runs its own v0.x → v1.0
# cadence; the workspace package version (1.1.0) tracks L1's released
# surface. grpcx-h3 joins the project-wide `v5.x` label only when
# L5 closes. See ../../docs/v5-scope.md.
version = "1.8.0"
edition = "2024"
description = "HTTP/3 (RFC 9114) + QPACK (RFC 9204) on the grpcx stack. An h3 replacement. No libc, no mio, no tokio, no quinn, no h3."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/grpcx"
homepage = "https://github.com/goliajp/grpcx"
documentation = "https://docs.rs/grpcx-h3"
authors = ["GOLIA K.K."]
keywords = ["http3", "rfc9114", "qpack", "rfc9204", "h3-replacement"]
categories = ["network-programming", "no-std", "web-programming"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
# Lower-layer grpcx-* only (dep direction rule, ARCHITECTURE.md).
# grpcx-io is L1; grpcx-rt is L2; grpcx-crypto is L3; grpcx-quic
# is L4; grpcx-h3 is L5.
grpcx-io = { path = "../grpcx-io" }
grpcx-rt = { path = "../grpcx-rt" }
grpcx-crypto = { path = "../grpcx-crypto" }
grpcx-quic = { path = "../grpcx-quic" }

[dev-dependencies]
# v0.5 loopback acceptance test (`tests/integ_loopback.rs`)
# mints a self-signed Ed25519 cert so it can drive the QUIC
# handshake end-to-end. Same exception class as L3 v0.4's /
# L4 v0.6's loopback tests.
rcgen = { workspace = true }
