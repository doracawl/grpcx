[package]
name = "grpcx-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# cargo-fuzz's standalone subcrate convention: declare an empty
# [workspace] so this manifest opts out of the outer workspace
# (which excludes us via `exclude = [...]` but cargo detects the
# parent workspace first and refuses to build until we explicitly
# opt out here).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.grpcx-io]
path = ".."

[[bin]]
name = "decode_one_event"
path = "fuzz_targets/decode_one_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lifecycle"
path = "fuzz_targets/lifecycle.rs"
test = false
doc = false
bench = false
