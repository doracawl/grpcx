[package]
name = "http1-syntax"
version = "0.1.0"
edition = "2024"
description = "RFC 7230 HTTP/1.1 syntax primitives — token char set, quoted-string parser, case-insensitive header matching, comma-separated token list. Pure Rust, no_std + alloc, 0 deps except byte-cursor."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/stones"
homepage = "https://github.com/goliajp/stones"
documentation = "https://docs.rs/http1-syntax"
authors = ["GOLIA K.K."]
keywords = ["http", "rfc7230", "header", "parser", "no-std"]
categories = ["web-programming::http-server", "no-std", "parser-implementations"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
byte-cursor = { path = "../byte-cursor", version = "0.1.1" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "throughput"
harness = false
